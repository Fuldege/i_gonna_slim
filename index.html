<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jing & Esther 减脂挑战</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:18px;

background:
linear-gradient(135deg,#fff7f2,#f4f0ff);

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;

color:#333;

}


.container{

max-width:520px;
margin:auto;

}



.card{

background:white;

border-radius:26px;

padding:20px;

margin-bottom:18px;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}


h1{

margin:0;

font-size:28px;

}


.subtitle{

color:#888;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}



.person{

background:#fff7f5;

border-radius:22px;

padding:18px;

text-align:center;

}



.name{

color:#888;

}


.weight{

font-size:32px;

font-weight:800;

margin:8px;

}



.goal{

font-size:14px;

color:#999;

}



input,
select,
textarea,
button{


width:100%;

padding:14px;

margin:7px 0;

border:none;

border-radius:16px;

background:#f5f5f5;

font-size:15px;

}



textarea{

height:90px;

}



button{

background:#ff8f8f;

color:white;

font-weight:bold;

font-size:16px;

}



.tip{

background:#fff4dc;

padding:15px;

border-radius:18px;

}



</style>

</head>


<body>


<div class="container">



<div class="card">

<h1>
🥑 Jing & Esther 减脂挑战
</h1>


<p class="subtitle">
Google Sheet同步版 V6.2
</p>

</div>





<div class="card">


<h3>
📊 当前体重
</h3>


<div class="grid">


<div class="person">


<div class="name">
Jing
</div>


<div class="weight" id="jingWeight">
-- kg
</div>


<div class="goal">
目标60kg
</div>


</div>





<div class="person">


<div class="name">
Esther
</div>


<div class="weight" id="estherWeight">
-- kg
</div>


<div class="goal">
目标58kg
</div>


</div>


</div>


</div>








<div class="card">


<h3>
📝 今日记录
</h3>



<select id="name">

<option>
Jing
</option>

<option>
Esther
</option>

</select>



<input 
id="date"
type="date">



<input 
id="weight"
placeholder="体重 kg">



<input 
id="waist"
placeholder="腰围 cm（可选）">



<input 
id="hip"
placeholder="臀围 cm（可选）">



<input 
id="steps"
placeholder="步数（可选）">



<input 
id="exercise"
placeholder="运动分钟（可选）">



<input 
id="snack"
placeholder="甜品 kcal（可选）">



<input 
id="sleep"
placeholder="睡眠小时（可选）">



<textarea 
id="note"
placeholder="今天状态（可选）"></textarea>




<button onclick="submitData()">

✨ 保存今日记录

</button>



<p id="msg"></p>


</div>







<div class="card">


<h3>
📈 体重趋势
</h3>


<canvas id="chart"></canvas>


</div>







<div class="card">


<h3>
🤖 今日反馈
</h3>


<div class="tip" id="advice">

等待数据...

</div>


</div>




</div>



<script>


// ============================
// Google Apps Script API
// ============================


const API_URL =

"https://script.google.com/macros/s/AKfycbzce3-sLOAaXBWJxWtmGs-cQDkXCTRbQRTywBAFgUrMalhf2jJc8sTiAYxRTIj2fZpL/exec";



// ============================
// 自动填今天日期
// ============================


document
.getElementById("date")
.value =

new Date()
.toISOString()
.slice(0,10);





// ============================
// 提交数据到 Google Sheet
// ============================


function submitData(){



const name =
document
.getElementById("name")
.value;



const date =
document
.getElementById("date")
.value;



const weight =
document
.getElementById("weight")
.value;




// 必填检查

if(
date === "" ||
weight === ""
){

alert(
"请填写日期和体重！"
);

return;

}




const data = {


name:name,


date:date,


weight:weight,


waist:
document
.getElementById("waist")
.value,


hip:
document
.getElementById("hip")
.value,


steps:
document
.getElementById("steps")
.value,


exercise:
document
.getElementById("exercise")
.value,


snack:
document
.getElementById("snack")
.value,


sleep:
document
.getElementById("sleep")
.value,


note:
document
.getElementById("note")
.value


};





fetch(
API_URL,
{

method:"POST",

body:
JSON.stringify(data)

}

)

.then(
response =>
response.text()

)

.then(

result=>{


document
.getElementById("msg")
.innerHTML =

"✅ 保存成功";


document
.getElementById("advice")
.innerHTML =

Number(data.snack)>300

?

"🍰 今天甜品稍多，不需要补偿节食，明天正常吃即可。"

:

"🌟 今日记录很好，继续保持！";



loadData();


}

)


.catch(

error=>{


console.log(error);


document
.getElementById("msg")
.innerHTML =

"❌ 保存失败，请检查API";


}


);



}








// ============================
// 从 Google Sheet 读取
// ============================


async function loadData(){



try{


const response =

await fetch(API_URL);



const data =

await response.json();




console.log(
"Sheet数据:",
data
);



updateDashboard(data);


drawChart(data);



}

catch(error){


console.log(
"读取失败:",
error
);


}


}









// ============================
// 更新首页体重
// ============================


function updateDashboard(data){



const jingData =

data.filter(

item=>

item.name==="Jing"

);



const estherData =

data.filter(

item=>

item.name==="Esther"

);






if(jingData.length>0){


const latest =

jingData[
jingData.length-1
];



document
.getElementById("jingWeight")
.innerHTML =

latest.weight
+
" kg";


}






if(estherData.length>0){


const latest =

estherData[
estherData.length-1
];



document
.getElementById("estherWeight")
.innerHTML =

latest.weight
+
" kg";


}



}









// ============================
// 体重曲线
// ============================


let weightChart;



function drawChart(data){



const jing =

data.filter(

x=>

x.name==="Jing"

);



const esther =

data.filter(

x=>

x.name==="Esther"

);





if(weightChart){

weightChart.destroy();

}




weightChart =

new Chart(

document
.getElementById("chart"),

{


type:"line",



data:{


labels:

jing.map(

x=>x.date

),



datasets:[


{

label:"Jing",

data:

jing.map(

x=>Number(x.weight)

)

},



{

label:"Esther",

data:

esther.map(

x=>Number(x.weight)

)

}


]


},




options:{


responsive:true,


scales:{


y:{


beginAtZero:false


}


}


}



}

);


}







// 页面打开自动读取

loadData();



</script>


</body>

</html>
