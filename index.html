<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>姐妹减脂挑战</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:18px;

background:
linear-gradient(135deg,#fff7f2,#f4f0ff);

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;

color:#333;

}


.container{

max-width:520px;
margin:auto;

}



.card{

background:white;

padding:20px;

border-radius:26px;

margin-bottom:18px;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}



h1{

margin:0;

font-size:28px;

}



.sub{

color:#888;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}



.person{

background:#fff7f5;

border-radius:22px;

padding:18px;

text-align:center;

}



.name{

color:#888;

}



.weight{

font-size:32px;

font-weight:800;

margin:8px;

}



.goal{

font-size:14px;

color:#999;

}




input,
select,
textarea,
button{


width:100%;

padding:14px;

margin:7px 0;

border:0;

border-radius:16px;

background:#f5f5f5;

font-size:15px;

}



textarea{

height:90px;

}



button{

background:#ff8f8f;

color:white;

font-weight:bold;

}



.tip{

background:#fff4dc;

padding:15px;

border-radius:18px;

line-height:1.6;

}


canvas{

margin-top:10px;

}


</style>


</head>




<body>


<div class="container">



<div class="card">


<h1>
🥑 姐妹减脂挑战
</h1>


<p class="sub">
Jing & Esther · 数据同步版
</p>


</div>





<div class="card">


<h3>
📊 当前体重
</h3>


<div class="grid">


<div class="person">

<div class="name">
Jing
</div>


<div class="weight" id="jingWeight">
-- kg
</div>


<div class="goal">
目标 60kg
</div>


</div>




<div class="person">


<div class="name">
Esther
</div>


<div class="weight" id="estherWeight">
-- kg
</div>


<div class="goal">
目标 58kg
</div>


</div>



</div>


</div>








<div class="card">


<h3>
📝 今日记录
</h3>



<select id="name">


<option>
Jing
</option>


<option>
Esther
</option>


</select>




<input id="date"
type="date">



<input id="weight"
placeholder="体重 kg">



<input id="waist"
placeholder="腰围 cm（可选）">



<input id="hip"
placeholder="臀围 cm（可选）">



<input id="steps"
placeholder="步数（可选）">



<input id="exercise"
placeholder="运动分钟（可选）">



<input id="snack"
placeholder="甜品 kcal（可选）">



<input id="sleep"
placeholder="睡眠小时（可选）">



<textarea id="note"
placeholder="今天状态（可选）"></textarea>




<button onclick="submitData()">

✨ 保存今日记录

</button>


<p id="msg"></p>


</div>








<div class="card">


<h3>
📈 体重变化
</h3>


<canvas id="chart"></canvas>


</div>







<div class="card">


<h3>
🤖 今日反馈
</h3>


<div class="tip" id="advice">

等待记录...

</div>


</div>





</div>







<script>


// =======================
// API
// =======================


const API_URL =
"https://script.google.com/macros/s/AKfycbzce3-sLOAaXBWJxWtmGs-cQDkXCTRbQRTywBAFgUrMalhf2jJc8sTiAYxRTIj2fZpL/exec";





date.value =
new Date()
.toISOString()
.slice(0,10);






// =======================
// 提交数据
// =======================



function submitData(){



if(
!date.value ||
!weight.value

){

alert(
"请填写日期和体重！"
);

return;

}




let data={


name:name.value,

date:date.value,

weight:weight.value,

waist:waist.value,

hip:hip.value,

steps:steps.value,

exercise:exercise.value,

snack:snack.value,

sleep:sleep.value,

note:note.value


};





fetch(API_URL,{

method:"POST",

body:
JSON.stringify(data)

})

.then(()=>{


msg.innerHTML=
"✅ 保存成功";


loadData();


});



}








// =======================
// 读取 Sheet
// =======================



async function loadData(){



try{


let res =
await fetch(API_URL);



let data =
await res.json();




updateDashboard(data);



drawChart(data);



}catch(e){


console.log(e);


}



}







// =======================
// 首页数据
// =======================



function updateDashboard(data){



let jing =
data
.filter(
x=>x.name=="Jing"
)
.pop();



let esther =
data
.filter(
x=>x.name=="Esther"
)
.pop();




if(jing){

jingWeight.innerHTML =
jing.weight+" kg";

}



if(esther){

estherWeight.innerHTML =
esther.weight+" kg";

}





}





// =======================
// 图表
// =======================



function drawChart(data){



let jing =
data.filter(
x=>x.name=="Jing"
);



let esther =
data.filter(
x=>x.name=="Esther"
);




new Chart(
document.getElementById("chart"),

{


type:"line",


data:{


labels:
jing.map(
x=>x.date
),



datasets:[


{

label:"Jing",

data:
jing.map(
x=>x.weight
)

},


{

label:"Esther",

data:
esther.map(
x=>x.weight
)

}


]


}



}


);



}






loadData();



</script>


</body>

</html>
