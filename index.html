<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jing & Esther 减脂挑战 V6.3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#fff7f2;padding:20px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:0;background:#f2f2f2}
button{background:#ff8f8f;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>🥑 Jing & Esther 减脂挑战</h1>
<p id="status">双向同步版</p>
</div>
<div class="card">
<h3>当前体重</h3>
<p>Jing: <b id="jing">--</b> kg</p>
<p>Esther: <b id="esther">--</b> kg</p>
</div>
<div class="card">
<select id="name"><option>Jing</option><option>Esther</option></select>
<input id="date" type="date">
<input id="weight" placeholder="体重 kg（必填）">
<input id="waist" placeholder="腰围">
<input id="hip" placeholder="臀围">
<input id="steps" placeholder="步数">
<input id="exercise" placeholder="运动分钟">
<input id="snack" placeholder="甜品kcal">
<input id="sleep" placeholder="睡眠">
<textarea id="note" placeholder="备注"></textarea>
<button id="save">保存今日记录</button>
<p id="msg"></p>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw1CsYf7TMZJBkUdzcpjqnUD2MaYqopnHnC0cGJFI1RSWYrGxapxEZI3TD-j9Ee-Tbx/exec";
date.value=new Date().toISOString().slice(0,10);
async function loadData(){
try{
let r=await fetch(API_URL);
let d=await r.json();
let j=d.filter(x=>x.name=="Jing").pop();
let e=d.filter(x=>x.name=="Esther").pop();
if(j) jing.innerHTML=j.weight;
if(e) esther.innerHTML=e.weight;
}catch(err){console.log(err)}
}
save.onclick=async()=>{
if(!date.value||!weight.value){alert("请填写日期和体重");return;}
let data={name:name.value,date:date.value,weight:weight.value,waist:waist.value,hip:hip.value,steps:steps.value,exercise:exercise.value,snack:snack.value,sleep:sleep.value,note:note.value};
try{
await fetch(API_URL,{method:"POST",body:JSON.stringify(data)});
msg.innerHTML="✅ 保存成功";
loadData();
}catch(e){msg.innerHTML="❌ 保存失败，请检查API";}
};
loadData();
</script>
</body>
</html>
